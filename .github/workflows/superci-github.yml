# uber-go/zap's .github/workflows/go.yml: build (go: 1.27.x), for the SuperCI scoreboard.
name: SuperCI (GitHub)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
        cache-dependency-path: '**/go.sum'

    - name: Download Dependencies
      run: |
        go mod download
        (cd benchmarks && go mod download)
        (cd zapgrpc/internal/test && go mod download)

    - name: Test
      run: make cover
